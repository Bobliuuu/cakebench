# Numbers: task counts from cakebench/tasks.py and the recorded A100 example scores in results/a100_example_status.json,
# merged by tools/readme_data.py into results/derived/readme_data.json
project:
  name: cakebench
  emoji: "🎂"
  tagline: "A kernel benchmark modelled on CAKE (arXiv 2608.12629): correctness against an fp32 oracle first, then speedup over a torch baseline"
  repo: Bobliuuu/cakebench
hero:
  title: cakebench
  subtitle: "score a GPU kernel, hand-written or LLM-generated, on five kernel families"
  chips: [kmeans, kNN, tinygemm, KDA decode, KDA prefill]
theme: {accent: "#27c8e8", accent2: "#ff6b6b", accent3: "#f2c14e", good: "#3ddc97"}
readme_out: README.md
assets_dir: assets
badges:
  - {label: python, message: "3.10+", color: 3776ab, logo: python}
  - {label: tasks, message: "{{ n.tasks }} kernel families", color: 27c8e8}
  - {label: shapes, message: "{{ n.shapes }} GPU shapes", color: a78bfa}
  - {label: "example suite", message: "{{ n.suite }} geomean", color: 3ddc97}
  - {label: paper, message: "CAKE arXiv 2608.12629", color: f2c14e}
  - {label: release, message: v0.1.0, color: 3ddc97, link: "https://github.com/Bobliuuu/cakebench/releases/tag/v0.1.0"}
  - {label: "🤗 dataset", message: Bobliu/cakebench, color: ff6b6b, link: "https://huggingface.co/datasets/Bobliu/cakebench"}
nav:
  - {emoji: "🎬", label: Video, anchor: video}
  - {emoji: "📊", label: Results, anchor: results}
  - {emoji: "🧩", label: How it works, anchor: how-it-works}
